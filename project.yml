name: fz-workSpace
options:
  bundleIdPrefix: net.fzyun
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  DevFlow:
    type: application
    platform: macOS
    sources:
      - path: Sources/DevFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fzyun.fzworkspace
        INFOPLIST_FILE: Sources/DevFlow/Info.plist
        PRODUCT_NAME: fz-workSpace
        SWIFT_OBJC_BRIDGING_HEADER: ""
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
